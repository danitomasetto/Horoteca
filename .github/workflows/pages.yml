name: Deploy Horoteca Web

on:
  push:
    branches: [main, master]
    paths:
      - horoteca-web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Horoteca Web to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cp horoteca-web/index.html "$RUNNER_TEMP/horoteca-index.html"
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          cp "$RUNNER_TEMP/horoteca-index.html" index.html
          git add index.html

          if git diff --cached --quiet; then
            echo "Horoteca Web is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy Horoteca Web"
          git push origin gh-pages
